name: Console checks
on:
  push:
    branches: [main]
    paths:
      - 'console-app/**'
      - 'console/**'
      - 'dashboard.html'
      - '.github/workflows/console-checks.yml'
  pull_request:
    paths:
      - 'console-app/**'
      - 'console/**'
      - 'dashboard.html'
      - '.github/workflows/console-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run release
      - name: Verify committed Pages output
        run: git diff --exit-code -- ../console/
